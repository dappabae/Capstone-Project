services:
  postgres-db:
    image: postgres:16-alpine
    container_name: clinic_container
    restart: always
    environment:
      POSTGRES_USER: clinic
      POSTGRES_PASSWORD: clinic123
      POSTGRES_DB: clinic_db
    ports:
      #format: "PortKomputerKalian:PortKomputerContainerDocker"
      - "5432:5432"
    volumes:
      #menyimpan data database ke dalam volume disk laptop agar tidak hilang
      - postgres_data_volume:/var/lib/postgresql/data

volumes:
  postgres_data_volume: